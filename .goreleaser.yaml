version: 2

before:
  hooks:
    - mkdir -p .man/man1
    - go run ./tools/gen-man .man/man1

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: .man/man1/bag.1
        dst: man/man1/bag.1

nfpms:
  - package_name: bag
    homepage: https://github.com/jamesjohnsdev/bag
    description: A simple, fast and declarative way to manage installed binaries across your system
    maintainer: James Johns <192176108+jamesjohnsdev@users.noreply.github.com>
    license: MIT
    formats:
      - deb
    contents:
      - src: .man/man1/bag.1
        dst: /usr/share/man/man1/bag.1

checksum:
  name_template: checksums.txt

changelog:
  use: github
